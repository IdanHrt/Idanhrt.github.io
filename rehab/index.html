<style>
/* Layout: one narrow column, operated top to bottom: archer -> week status -> draw (target button) -> session cards -> log. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#14202E; --muted:#5A6676; --line:#D8DEE5;
  --gold:#F2B705; --gold-ink:#1C1500; --shoulder:#1D6BB8; --core:#C9372C; --good:#23805A;
  --ring-black:#1B1F24; --ring-white:#FFFFFF;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-he:"Heebo","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;
  --scrim:rgba(13,19,26,.45);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#151E28; --ink:#E7ECF1; --muted:#95A3B3; --line:#263341;
  --gold:#F5C21B; --gold-ink:#1C1500; --shoulder:#5CA3EA; --core:#EE6B5F; --good:#4FC08D;
  --ring-black:#05080B; --ring-white:#DDE3E9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#151E28; --ink:#E7ECF1; --muted:#95A3B3; --line:#263341;
  --gold:#F5C21B; --gold-ink:#1C1500; --shoulder:#5CA3EA; --core:#EE6B5F; --good:#4FC08D;
  --ring-black:#05080B; --ring-white:#DDE3E9; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2.3rem;line-height:1;font-weight:800;text-transform:uppercase}
h2{font-size:1.25rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.label{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input[type=text],textarea{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
select{font-weight:600;font-size:17px;min-height:46px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
.addname{display:flex;gap:8px}
.addname input{flex:1}
details summary{cursor:pointer;color:var(--muted);font-size:.88rem;font-weight:600}
.notice{font-size:.85rem;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px}

/* week status */
.week{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{display:flex;flex-direction:column;gap:6px;min-width:0}
.cat .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat .name{font-weight:700;font-size:.9rem}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dot.done{background:var(--c)}
.dot.now{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}
.cat.S{--c:var(--shoulder)} .cat.C{--c:var(--core)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{border:0;background:transparent;width:40px;height:36px;cursor:pointer;font-weight:700}
.stepper span{min-width:22px;text-align:center}
@media (max-width:420px){.week{grid-template-columns:1fr}}
@media (max-width:480px){.done-bar .btn{width:100%;justify-content:center;padding-block:14px;font-size:1rem}.target{--s:170px}.card{padding:12px 10px 12px 12px}.acts{flex-direction:column}}
html{-webkit-text-size-adjust:100%}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* draw */
.drawzone{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:6px}
.target{--s:150px;width:var(--s);height:var(--s);border-radius:50%;border:0;cursor:pointer;position:relative;
  background:radial-gradient(circle,var(--gold) 0 19%,var(--core) 19.5% 39%,var(--shoulder) 39.5% 59%,var(--ring-black) 59.5% 79%,var(--ring-white) 79.5% 100%);
  box-shadow:0 0 0 1px var(--line),0 10px 24px -12px rgba(0,0,0,.45);transition:transform .15s ease}
.target span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--gold-ink);letter-spacing:.06em}
.target:hover{transform:scale(1.03)}
.target:active{transform:scale(.97)}
.target:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed;transform:none}
.target.hit{animation:hit .45s ease}
@keyframes hit{0%{transform:scale(1)}35%{transform:scale(.9)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
kbd{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}
.hint{font-size:.85rem;color:var(--muted)}

/* session */
.group{display:flex;flex-direction:column;gap:8px}
.group h2{display:flex;align-items:center;gap:8px}
.group h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.group.S{--c:var(--shoulder)} .group.C{--c:var(--core)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:flex-start}
.card .body{flex:1;min-width:0}
.card .t{font-weight:700;font-size:1.02rem;line-height:1.3}
.card .m{color:var(--muted);font-size:.84rem;margin-top:2px}
.card .note{font-size:.82rem;margin-top:4px}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;border:1px solid var(--line);color:var(--muted)}
.acts{display:flex;gap:4px;flex-shrink:0}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.icon svg{width:18px;height:18px}
.icon.liked{color:var(--core);border-color:var(--core)}
.icon.liked svg path{fill:currentColor}
.done-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;font-size:.92rem;padding:8px}

/* log + pool */
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{border-top:1px solid var(--line);padding-top:8px;font-size:.86rem}
.log li:first-child{border-top:0;padding-top:0}
.log .when{font-weight:600}
.pool{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pool li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.pool li:first-child{border-top:0}
.pool .pn{flex:1;min-width:0;font-size:.9rem}
.pool .sw{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.howto{margin-top:8px;border:0;background:transparent;padding:6px 0;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px}
.links{display:flex;gap:16px;flex-wrap:wrap}
.howto.alt{color:var(--muted);text-decoration-color:var(--line)}
.ask{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .btn{padding-block:10px}
.dot.paused{border-style:dashed;opacity:.5}
.dot.off{border-color:var(--line);background:transparent}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.toggle .name{font-weight:700;font-size:.92rem}
.switch{flex-shrink:0;width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface);position:relative;cursor:pointer;padding:0}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s ease,background .15s ease}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"] span{transform:translateX(22px);background:var(--gold)}
@media (prefers-reduced-motion:reduce){.switch span{transition:none}}
.log li.prow{display:flex;align-items:center;gap:10px}
.pool .pn{border:0;background:transparent;text-align:left;padding:8px 0;cursor:pointer}
.pool .pn:hover{text-decoration:underline;text-decoration-color:var(--gold)}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet .box{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;
  padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:18px;border-bottom:1px solid var(--line)}}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[lang="he"]{font-family:var(--f-he)}
.sheet h3{margin:0;font-family:var(--f-display);font-size:1.6rem;line-height:1.1;text-wrap:balance}
.sheet .he h3{font-family:var(--f-he);font-weight:700;font-size:1.35rem}
.sheet dl{margin:0;display:flex;flex-direction:column;gap:10px}
.sheet dt{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--muted))}
.sheet dd{margin:2px 0 0;font-size:1rem;line-height:1.55}
.sheet .he dt{letter-spacing:0;font-size:.85rem;font-family:var(--f-he)}
.sheet .he dd{font-family:var(--f-he);font-size:1.05rem}
.sheet .S{--c:var(--shoulder)} .sheet .C{--c:var(--core)}
.prog{display:flex;gap:14px;align-items:center}
.goalring svg{width:76px;height:76px;display:block}
.goalinfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.goalinfo .name{font-weight:700}
.tag.hit{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.sv{font-size:1.3rem;line-height:1.2}
.sl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:360px){.stats{grid-template-columns:repeat(2,1fr)}}
.badges{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badges li{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;min-width:0}
.badges li svg{width:30px;height:30px;flex-shrink:0;color:var(--line)}
.badges li .bt{color:var(--muted)}
.badges li.got{border-color:var(--gold)}
.badges li.got svg{color:var(--gold)}
.badges li.got .bt{color:var(--ink)}
.badges.big{grid-template-columns:1fr}.badges.big li svg{width:44px;height:44px}
.bt{font-weight:700;font-size:.86rem}.bd{font-size:.76rem;color:var(--muted)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:420px){.badges{grid-template-columns:1fr}}
.confirm{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--gold);width:100%;max-width:520px;font-size:.92rem}
.card .dose{font-family:var(--f-mono);font-size:.86rem;font-weight:500;margin-top:3px;color:var(--ink)}
.sheet dd.dosedd{font-weight:700}
footer{color:var(--muted);font-size:.84rem}
footer p{margin:0 0 6px;max-width:65ch}
@media (prefers-reduced-motion:reduce){.target,.target.hit{animation:none;transition:none}}
</style>
</head>

</div>

Sliders pike (sliders, barefoot or socks)", "sub": "Anti-extension", "eq": "Sliders, or bodyweight on low-friction surface (barefoot/socks)", "pos": "High plank, barefoot or socks", "lat": "Bilateral", "note": "Hands stay fixed; feet slide toward the hands into a pike (hips high, inverted V)"}, {"id": "c-rpl", "c": "C", "n": "Reverse plank (hip lift)", "sub": "Extensor", "eq": "Bodyweight", "pos": "Supported on hands, face up, legs extended", "lat": "Bilateral"}, {"id": "c-rpll", "c": "C", "n": "Reverse plank with leg raise", "sub": "Extensor", "eq": "Bodyweight", "pos": "Supported on hands, face up, legs extended", "lat": "Alternating"}, {"id": "c-whk", "c": "C", "n": "Ab wheel rollout on knees (modified)", "sub": "Anti-extension", "eq": "Ab wheel", "pos": "Kneeling, hands on wheel", "lat": "Bilateral"}, {"id": "c-whf", "c": "C", "n": "Ab wheel rollout, straight legs (full)", "sub": "Anti-extension", "eq": "Ab wheel", "pos": "Standing on toes, hips hinged, hands on wheel", "lat": "Bilateral"}, {"id": "c-drag", "c": "C", "n": "Plank drag (hand-walk, sliders or socks)", "sub": "Anti-rotation", "eq": "Sliders (preferred), or socks on low-friction surface", "pos": "High plank, feet on sliders or in socks", "lat": "Alternating hands", "note": "Hands walk forward while the feet are dragged along the floor; sliders preferred"}, {"id": "c-lsit", "c": "C", "n": "Sliders L-sit bridge", "sub": "Extensor", "eq": "Sliders", "pos": "Supported on straight arms, face up, hips lifted, feet on sliders", "lat": "Bilateral", "note": "Knees straight throughout; hips move from 90° (L position) to straight as the feet slide"}];
const DESC={"s-hang": {"en": {"s": "Hang from a pull-up bar, hands shoulder-width or slightly wider, arms straight.", "m": "Pull the shoulder blades down and slightly back so the body rises a few centimetres without bending the elbows. Hold the position.", "c": "Ribs down, legs together, trunk lightly braced. Think “shoulders away from the ears”.", "x": "Bending the elbows, swinging, or letting the shoulders creep up to the ears during the hold."}, "he": {"n": "תלייה אקטיבית על מתח", "s": "היתלו על מוט מתח, אחיזה ברוחב הכתפיים או מעט רחבה יותר, ידיים ישרות.", "m": "משכו את השכמות למטה ומעט לאחור כך שהגוף מתרומם כמה סנטימטרים בלי לכופף מרפקים. החזיקו את המנח.", "c": "צלעות למטה, רגליים צמודות, בטן מופעלת קלות. חשבו „כתפיים רחוק מהאוזניים”.", "x": "כיפוף מרפקים, התנדנדות, או עליית הכתפיים לכיוון האוזניים במהלך ההחזקה."}}, "s-dep": {"en": {"s": "Sit on a bench or a sturdy chair with hands beside the hips, fingers forward, arms straight. Hips just off the edge or in light contact with the seat.", "m": "Without bending the elbows, push the seat down so the shoulders move away from the ears and the body rises slightly. Lower slowly until the shoulders rise toward the ears, then repeat.", "c": "The movement comes only from the shoulder blades. Keep the chest tall.", "x": "Bending the elbows (this turns it into a dip) or rolling the shoulders forward."}, "he": {"n": "דיכוי שכמות על ספסל", "s": "שבו על ספסל או על כיסא יציב, כפות הידיים ליד הירכיים, אצבעות קדימה, ידיים ישרות. האגן ממש בקצה המושב או במגע קל איתו.", "m": "בלי לכופף מרפקים, דחפו את המושב למטה כך שהכתפיים מתרחקות מהאוזניים והגוף מתרומם מעט. רדו לאט עד שהכתפיים עולות לכיוון האוזניים, וחזרו.", "c": "התנועה מגיעה רק מהשכמות. חזה גבוה.", "x": "כיפוף מרפקים (זה הופך את התרגיל למקבילים) או גלגול הכתפיים קדימה."}}, "s-prot": {"en": {"s": "High plank (push-up position), hands under the shoulders, body in a straight line.", "m": "Let the chest sink slightly so the shoulder blades come together, then push the floor away so the upper back rounds slightly and the blades spread apart. Elbows stay straight throughout.", "c": "Slow and controlled, full range at both ends. Hips level, trunk braced.", "x": "Bending the elbows, sagging hips, or moving the head instead of the shoulder blades."}, "he": {"n": "פרוטרקציה של שכמות בתנוחת שכיבת סמיכה", "s": "פלאנק גבוה (תנוחת שכיבת סמיכה), כפות הידיים מתחת לכתפיים, הגוף בקו ישר.", "m": "אפשרו לחזה לשקוע מעט כך שהשכמות מתקרבות, ואז דחפו את הרצפה כך שהגב העליון מתעגל מעט והשכמות מתרחקות זו מזו. המרפקים ישרים לאורך כל התנועה.", "c": "לאט ובשליטה, טווח מלא בשני הקצוות. אגן ישר, בטן מופעלת.", "x": "כיפוף מרפקים, שקיעת האגן, או הזזת הראש במקום השכמות."}}, "s-ret": {"en": {"s": "Face a low pulley and hold the handle(s) with straight arms in front of you. Step back so the cable is under tension. Stand tall.", "m": "Squeeze the shoulder blades back and together without bending the elbows. Hold 1–2 s, then let them slide forward slowly.", "c": "Only the shoulder blades move; the arms stay passive. Shoulders down.", "x": "Pulling with the arms (rowing), shrugging, or leaning the torso back."}, "he": {"n": "קירוב שכמות (רטרקציה) בפולי תחתון", "s": "עמדו מול פולי תחתון ואחזו בידית או בידיות בידיים ישרות לפנים. צעד אחורה כך שהכבל מתוח. עמידה זקופה.", "m": "קרבו את השכמות לאחור ואחת אל השנייה בלי לכופף מרפקים. החזיקו 1–2 שניות, ואז אפשרו להן לחזור קדימה לאט.", "c": "רק השכמות זזות; הידיים פסיביות. כתפיים למטה.", "x": "משיכה עם הידיים (חתירה), הרמת כתפיים, או הטיית הגו לאחור."}}, "s-cer": {"en": {"s": "Stand side-on to a cable set at elbow height and hold the handle in the hand farther from the machine. Elbow bent to 90° and held against your side (a small rolled towel between elbow and body helps).", "m": "Rotate the forearm outward, away from the body, keeping the elbow at 90° and at your side. Return slowly.", "c": "Movement comes from the shoulder only; the forearm stays horizontal. Slow return, 2–3 s.", "x": "The elbow drifting away from the body, twisting the trunk, or bending the wrist to gain range."}, "he": {"n": "סיבוב חיצוני של הכתף בכבל, מרפק ב-90°", "s": "עמדו בצד למכונת הכבל, הכבל בגובה המרפק, ואחזו בידית ביד הרחוקה מהמכונה. המרפק מכופף ל-90° וצמוד לגוף (מגבת קטנה מגולגלת בין המרפק לגוף עוזרת).", "m": "סובבו את האמה החוצה, הרחק מהגוף, כשהמרפק נשאר ב-90° וצמוד לגוף. חזרו לאט.", "c": "התנועה רק מהכתף; האמה נשארת אופקית. חזרה איטית, 2–3 שניות.", "x": "התרחקות המרפק מהגוף, סיבוב הגו, או כיפוף שורש כף היד כדי להגדיל טווח."}}, "s-der": {"en": {"s": "Sit with one foot raised on a bench and rest the elbow of the working arm on that knee, upper arm close to shoulder height, elbow bent to 90°, forearm pointing forward with the dumbbell.", "m": "Rotate the forearm upward until it points to the ceiling, keeping the elbow on the knee. Lower slowly.", "c": "Elbow stays at 90° and in contact with the knee. Light load, full control.", "x": "Lifting the elbow off the knee, arching the back, or shrugging."}, "he": {"n": "סיבוב חיצוני של הכתף עם משקולת, יד נתמכת על הברך", "s": "שבו עם רגל אחת מורמת על ספסל והניחו את מרפק היד העובדת על הברך. הזרוע קרובה לגובה הכתף, המרפק ב-90°, והאמה עם המשקולת מכוונת קדימה.", "m": "סובבו את האמה למעלה עד שהיא מכוונת לתקרה, כשהמרפק נשאר על הברך. הורידו לאט.", "c": "המרפק נשאר ב-90° ובמגע עם הברך. משקל קל, שליטה מלאה.", "x": "הרמת המרפק מהברך, קשת בגב, או הרמת הכתף."}}, "s-swim": {"en": {"s": "Lie on your back, knees bent, feet flat. Arms on the floor in a goalpost position: elbows at shoulder height, bent to 90°.", "m": "Slide the arms overhead along the floor as far as you can while the backs of the hands, the elbows and the lower back stay on the floor. Slide back down, drawing the elbows toward the hips.", "c": "Ribs down, lower back flat. Range is set by keeping contact, not by forcing it.", "x": "Arching the lower back, lifting the hands or elbows off the floor, or shrugging."}, "he": {"n": "מלאכים בשכיבה על הגב", "s": "שכבו על הגב, ברכיים כפופות, כפות רגליים על הרצפה. הידיים על הרצפה בצורת עמוד שער: מרפקים בגובה הכתפיים, כפופים ל-90°.", "m": "החליקו את הידיים מעל הראש לאורך הרצפה ככל שניתן, כשגב כפות הידיים, המרפקים והגב התחתון נשארים על הרצפה. החליקו חזרה למטה תוך משיכת המרפקים לכיוון האגן.", "c": "צלעות למטה, גב תחתון צמוד. הטווח נקבע לפי שמירת המגע, לא בכוח.", "x": "קשת בגב התחתון, הרמת כפות הידיים או המרפקים מהרצפה, או הרמת כתפיים."}}, "s-t": {"en": {"s": "Hinge at the hips with a flat back, torso close to parallel to the floor, knees slightly bent. Arms hang straight down with light dumbbells or a band, thumbs forward.", "m": "Raise the arms out to the sides to shoulder height to form a “T”, squeezing the shoulder blades together. Lower slowly.", "c": "Start the movement from the shoulder blades. Arms straight, neck in line with the spine.", "x": "Rounding the back, shrugging, or using momentum or a heavy load."}, "he": {"n": "T בהטיה קדימה", "s": "התכופפו מהאגן עם גב ישר, הגו כמעט מקביל לרצפה, ברכיים מעט כפופות. הידיים תלויות ישר למטה עם משקולות קלות או גומייה, אגודלים קדימה.", "m": "הרימו את הידיים לצדדים עד גובה הכתפיים ליצירת „T”, תוך קירוב השכמות. הורידו לאט.", "c": "התנועה מתחילה מהשכמות. ידיים ישרות, צוואר בהמשך הגב.", "x": "עיגול הגב, הרמת כתפיים, או תנופה ומשקל כבד."}}, "s-y": {"en": {"s": "Same position as the “T”: hip hinge, flat back, arms hanging with light dumbbells or a band.", "m": "Raise the arms forward and up at about 45° outside the head to form a “Y”, thumbs up, until the arms are in line with the torso. Lower slowly.", "c": "Draw the shoulder blades down and back before lifting. Light load.", "x": "Arching the lower back, shrugging (the upper trapezius takes over), or bending the elbows."}, "he": {"n": "Y בהטיה קדימה", "s": "אותו מנח כמו ב-T: הטיה מהאגן, גב ישר, ידיים תלויות עם משקולות קלות או גומייה.", "m": "הרימו את הידיים קדימה ולמעלה בזווית של כ-45° מחוץ לקו הראש ליצירת „Y”, אגודלים למעלה, עד שהידיים בקו הגו. הורידו לאט.", "c": "משכו את השכמות למטה ולאחור לפני ההרמה. משקל קל.", "x": "קשת בגב התחתון, הרמת כתפיים (הטרפז העליון משתלט), או כיפוף מרפקים."}}, "c-inch": {"en": {"s": "Stand tall, feet hip-width apart.", "m": "Hinge forward and place the hands on the floor (bend the knees as needed). Walk the hands out to a high plank, pause, then walk the feet toward the hands and stand up.", "c": "In the plank: hips level, ribs down, glutes on.", "x": "Hips sagging as the hands walk out, or walking out farther than you can control."}, "he": {"n": "הליכת תולעת (אינצ'וורם)", "s": "עמידה זקופה, רגליים ברוחב האגן.", "m": "התכופפו קדימה והניחו את כפות הידיים על הרצפה (כופפו ברכיים לפי הצורך). התקדמו עם הידיים עד פלאנק גבוה, עצרו רגע, ואז התקדמו עם הרגליים לכיוון הידיים וקומו.", "c": "בפלאנק: אגן ישר, צלעות למטה, ישבן מופעל.", "x": "שקיעת האגן כשהידיים מתקדמות, או יציאה רחוק יותר ממה שאפשר לשלוט בו."}}, "c-hollow": {"en": {"s": "Lie on your back, arms overhead, legs straight.", "m": "Press the lower back into the floor and lift the shoulders and legs a few centimetres off the floor into a shallow banana shape. Hold.", "c": "The lower back stays in contact. To make it easier, bend the knees or bring the arms alongside the body.", "x": "The lower back lifting off the floor, holding your breath, or straining the neck (keep the chin slightly tucked)."}, "he": {"n": "החזקת הולו (גוף קעור)", "s": "שכבו על הגב, ידיים מעל הראש, רגליים ישרות.", "m": "הצמידו את הגב התחתון לרצפה והרימו כתפיים ורגליים כמה סנטימטרים מהרצפה לצורת בננה רדודה. החזיקו.", "c": "הגב התחתון נשאר צמוד. להקלה: כופפו ברכיים או הביאו את הידיים לצד הגוף.", "x": "התרוממות הגב התחתון מהרצפה, עצירת נשימה, או מתיחת הצוואר (סנטר מעט פנימה)."}}, "c-hroll": {"en": {"s": "Lie on your back in the hollow hold position: lower back pressed to the floor, shoulders and legs a few centimetres up.", "m": "Keeping the hollow shape, roll onto one side as one unit, pause briefly, then roll back to the start. Next roll to the other side.", "c": "The shape does not change during the roll: arms, legs and trunk move together. Breathe steadily.", "x": "Breaking the shape (legs dropping, head moving) or swinging the legs to start the roll."}, "he": {"n": "החזקת הולו עם גלגול לצד", "s": "שכבו על הגב בתנוחת הולו: הגב התחתון צמוד לרצפה, הכתפיים והרגליים מורמות כמה סנטימטרים.", "m": "תוך שמירה על צורת ההולו, התגלגלו לצד אחד כיחידה אחת, עצרו לרגע, וחזרו למנח ההתחלה. אחר כך התגלגלו לצד השני.", "c": "צורת הגוף לא משתנה בזמן הגלגול: ידיים, רגליים וגו זזים יחד. נשימה רגועה.", "x": "שבירת הצורה (רגליים נופלות, ראש זז) או תנופה של הרגליים כדי להתחיל את הגלגול."}}, "c-ball": {"en": {"s": "Kneel facing a stability ball with the forearms on top of the ball, body straight from knees to head.", "m": "Roll the ball forward by opening the shoulders and hips together, as far as you can without the lower back arching. Pull back with the forearms to the start.", "c": "Trunk braced, glutes squeezed, ribs down.", "x": "The lower back sagging, the hips staying back (bending at the hips), or going past the range you control."}, "he": {"n": "גלגול כדור פיזיו קדימה (רול-אאוט)", "s": "כרעו מול כדור פיזיו עם האמות על הכדור, הגוף בקו ישר מהברכיים עד הראש.", "m": "גלגלו את הכדור קדימה תוך פתיחה של הכתפיים והאגן יחד, ככל שאפשר בלי קשת בגב התחתון. משכו עם האמות חזרה למנח ההתחלה.", "c": "בטן מופעלת, ישבן מכווץ, צלעות למטה.", "x": "שקיעת הגב התחתון, אגן שנשאר מאחור (כיפוף באגן), או יציאה מעבר לטווח שבשליטה."}}, "c-touch": {"en": {"s": "High plank, hands under the shoulders, feet slightly wider than hip-width.", "m": "Lift one hand and touch the opposite shoulder, put it back down, then switch sides.", "c": "Hips stay level and still; imagine a glass of water on your lower back. Wider feet make it easier.", "x": "Hips rocking side to side, or rushing."}, "he": {"n": "נגיעות בכתף בפלאנק", "s": "פלאנק גבוה, כפות הידיים מתחת לכתפיים, רגליים מעט רחבות מרוחב האגן.", "m": "הרימו יד אחת וגעו בכתף הנגדית, החזירו לרצפה והחליפו צד.", "c": "האגן נשאר ישר ויציב; דמיינו כוס מים על הגב התחתון. רגליים רחבות יותר מקלות.", "x": "נדנוד האגן מצד לצד, או ביצוע מהיר."}}, "c-super": {"en": {"s": "High plank (push-up position), hands under the shoulders, feet hip-width or slightly wider.", "m": "Lift one arm forward and the opposite leg back until both are in line with the body, hold 2–3 s, lower and switch.", "c": "Hips level and square to the floor, trunk braced, reach long. Wider feet make it easier.", "x": "Hips rotating or sagging, lifting the leg above the body line, or shifting the weight to one side."}, "he": {"n": "סופרמן בפלאנק: הרמת יד ורגל נגדית", "s": "פלאנק גבוה (תנוחת שכיבת סמיכה), כפות הידיים מתחת לכתפיים, רגליים ברוחב האגן או מעט רחב יותר.", "m": "הרימו יד אחת קדימה ואת הרגל הנגדית אחורה עד שהן בקו הגוף, החזיקו 2–3 שניות, הורידו והחליפו.", "c": "אגן ישר ומקביל לרצפה, בטן מופעלת, להאריך. רגליים רחבות יותר מקלות.", "x": "סיבוב או שקיעה של האגן, הרמת הרגל מעל קו הגוף, או העברת משקל לצד אחד."}}, "c-pallof": {"en": {"s": "Stand side-on to a cable at chest height. Hold the handle with both hands against the sternum and step away so there is tension. Feet hip-width, knees soft.", "m": "Press the handle straight out in front of the chest, hold 2–3 s while resisting the pull, then bring it back. Do both sides.", "c": "The trunk stays square to the front. Tension rises as the arms straighten.", "x": "Rotating toward the cable, leaning away from it, or shrugging."}, "he": {"n": "פאלוף בכבל (התנגדות לסיבוב)", "s": "עמדו בצד לכבל בגובה החזה. אחזו בידית בשתי הידיים צמוד לעצם החזה וזוזו הצידה כך שיש מתח. רגליים ברוחב האגן, ברכיים רכות.", "m": "דחפו את הידית ישר קדימה מול החזה, החזיקו 2–3 שניות תוך התנגדות למשיכה, והחזירו. בצעו בשני הצדדים.", "c": "הגו נשאר ישר מול הכיוון הקדמי. המתח גדל כשהידיים מתיישרות.", "x": "סיבוב לכיוון הכבל, הטיה הרחק ממנו, או הרמת כתפיים."}}, "c-sarot": {"en": {"s": "Stand side-on to a cable at chest height and hold the handle with both hands, arms straight in front of the chest. Feet shoulder-width.", "m": "Rotate the trunk away from the cable with the arms staying straight and in front of the chest, then return slowly. Do both sides.", "c": "Rotation comes from the hips and trunk together; the hands stay in line with the sternum. Control the return.", "x": "Bending the elbows, pulling with the arms, or letting the cable pull you back."}, "he": {"n": "סיבובים בכבל עם ידיים ישרות", "s": "עמדו בצד לכבל בגובה החזה ואחזו בידית בשתי הידיים, ידיים ישרות מול החזה. רגליים ברוחב הכתפיים.", "m": "סובבו את הגו הרחק מהכבל כשהידיים נשארות ישרות ומול החזה, וחזרו לאט. בצעו בשני הצדדים.", "c": "הסיבוב מגיע מהאגן והגו יחד; הידיים בקו עצם החזה. שליטה בחזרה.", "x": "כיפוף מרפקים, משיכה עם הידיים, או לתת לכבל למשוך אתכם חזרה."}}, "c-chop": {"en": {"s": "Half-kneeling (one knee down, other foot forward, both at 90°), side-on to a high cable or a band anchored high, with the knee nearer the anchor on the floor. Hold the handle with both hands above the shoulder nearer the anchor.", "m": "Pull the handle diagonally down and across the body to the opposite hip, rotating the trunk, then return under control. Do both sides.", "c": "Tall posture, glute of the down leg squeezed, hips stay facing forward.", "x": "Losing balance or shifting the hips, arching the back, or pulling with the arms only."}, "he": {"n": "חטיבת עצים בכריעה על ברך אחת", "s": "כריעה על ברך אחת (ברך אחת על הרצפה, כף הרגל השנייה קדימה, שתיהן ב-90°), בצד לכבל גבוה או לגומייה מעוגנת גבוה, כשהברך הקרובה לעיגון על הרצפה. אחזו בידית בשתי הידיים מעל הכתף הקרובה לעיגון.", "m": "משכו את הידית באלכסון למטה ולרוחב הגוף עד לירך הנגדית תוך סיבוב הגו, וחזרו בשליטה. בצעו בשני הצדדים.", "c": "יציבה זקופה, ישבן של הרגל שעל הרצפה מכווץ, האגן נשאר מכוון קדימה.", "x": "איבוד שיווי משקל או תזוזת האגן, קשת בגב, או משיכה רק עם הידיים."}}, "c-spk": {"en": {"s": "Lie on your side with the forearm under the shoulder and the knees bent to about 90°; hips, knees and shoulders in line.", "m": "Lift the hips until the body is straight from knees to head, and hold. Do both sides.", "c": "Push the floor away with the forearm. Hips forward, not piking back.", "x": "Hips sagging, the shoulder collapsing toward the ear, or rolling forward or back."}, "he": {"n": "פלאנק צד על הברכיים", "s": "שכבו על הצד, אמה מתחת לכתף, ברכיים כפופות לכ-90°; אגן, ברכיים וכתפיים בקו אחד.", "m": "הרימו את האגן עד שהגוף ישר מהברכיים עד הראש, והחזיקו. בצעו בשני הצדדים.", "c": "דחפו את הרצפה עם האמה. אגן קדימה, לא בורח אחורה.", "x": "שקיעת האגן, קריסת הכתף לכיוון האוזן, או התגלגלות קדימה או אחורה."}}, "c-sps": {"en": {"s": "Lie on your side with the forearm under the shoulder and the legs straight, feet stacked (easier: top foot in front of the bottom one).", "m": "Lift the hips until the body is straight from ankles to head, and hold. Do both sides.", "c": "Straight line, hips forward, push the floor away with the forearm.", "x": "Hips sagging, hips drifting back, or the shoulder collapsing."}, "he": {"n": "פלאנק צד עם רגליים ישרות", "s": "שכבו על הצד, אמה מתחת לכתף, רגליים ישרות וכפות הרגליים זו על זו (להקלה: כף הרגל העליונה לפני התחתונה).", "m": "הרימו את האגן עד שהגוף ישר מהקרסוליים עד הראש, והחזיקו. בצעו בשני הצדדים.", "c": "קו ישר, אגן קדימה, דחיפת הרצפה עם האמה.", "x": "שקיעת האגן, אגן שבורח אחורה, או קריסת הכתף."}}, "c-lmtw": {"en": {"s": "Stand facing the landmine, feet shoulder-width, holding the end of the bar with both hands at chest height, arms almost straight.", "m": "Keeping the feet fixed and the arms long, move the bar in an arc toward one hip by rotating the trunk, then across to the other side.", "c": "Hips and feet stay still; the rotation comes from the trunk, under control. Trunk braced throughout.", "x": "Pivoting the feet, bending the arms to lift the bar, or letting the weight pull you past the range you control."}, "he": {"n": "סיבובי לנדמיין (רגליים קבועות)", "s": "עמדו מול הלנדמיין, רגליים ברוחב הכתפיים, אחזו בקצה המוט בשתי הידיים בגובה החזה, ידיים כמעט ישרות.", "m": "כפות הרגליים נשארות קבועות והידיים ארוכות; הובילו את המוט בקשת לכיוון ירך אחת באמצעות סיבוב הגו, ואז לצד השני.", "c": "האגן וכפות הרגליים נשארים במקום; הסיבוב מהגו ובשליטה. בטן מופעלת לאורך כל התנועה.", "x": "סיבוב כפות הרגליים, כיפוף הידיים כדי להרים את המוט, או לתת למשקל למשוך אתכם מעבר לטווח שבשליטה."}}, "c-bext": {"en": {"s": "Lie face down, hands lightly by the temples or arms by your sides, legs straight with the feet on the floor.", "m": "Lift the chest a few centimetres by extending the upper back, hold 1–2 s, and lower slowly.", "c": "Glutes on, neck in line, lift from the upper back, small range.", "x": "Throwing the head back, pushing up with the hands, or forcing a big arch in the lower back."}, "he": {"n": "הרמות גו בשכיבה על הבטן", "s": "שכבו על הבטן, הידיים קלות ליד הרקות או לאורך הגוף, רגליים ישרות וכפות הרגליים על הרצפה.", "m": "הרימו את החזה כמה סנטימטרים ביישור הגב העליון, החזיקו 1–2 שניות, ורדו לאט.", "c": "ישבן מופעל, צוואר בהמשך הגב, ההרמה מהגב העליון, טווח קטן.", "x": "זריקת הראש לאחור, דחיפה עם הידיים, או קשת גדולה בגב התחתון."}}, "c-cext": {"en": {"s": "Lie face down, arms reaching overhead, legs straight, forehead on the floor or just above it.", "m": "Lift one arm and the opposite leg a few centimetres, hold 2–3 s, lower, then switch.", "c": "Reach long rather than lifting high. Glutes on, neck in line with the spine.", "x": "Excessive arching of the lower back, twisting the hips, or lifting the head high."}, "he": {"n": "הרמת יד ורגל נגדית בשכיבה על הבטן", "s": "שכבו על הבטן, ידיים מושטות מעל הראש, רגליים ישרות, המצח על הרצפה או מעט מעליה.", "m": "הרימו יד אחת ואת הרגל הנגדית כמה סנטימטרים, החזיקו 2–3 שניות, הורידו והחליפו.", "c": "להאריך ולא להרים גבוה. ישבן מופעל, צוואר בהמשך הגב.", "x": "קשת מוגזמת בגב התחתון, סיבוב האגן, או הרמת הראש גבוה."}}, "s-wall": {"en": {"s": "Stand with your back against a wall, feet a small step forward, knees soft. Arms on the wall in a goalpost position: elbows at shoulder height, bent to 90°.", "m": "Slide the arms up the wall as far as you can while the forearms and backs of the hands stay in contact, then slide down, drawing the elbows toward the hips.", "c": "Ribs down, lower back close to the wall. Let the shoulder blades rotate upward as the arms rise.", "x": "Arching the lower back to reach higher, shrugging, or losing contact with the wall."}, "he": {"n": "החלקות על הקיר", "s": "עמדו עם הגב צמוד לקיר, כפות הרגליים צעד קטן קדימה, ברכיים רכות. הידיים על הקיר בצורת עמוד שער: מרפקים בגובה הכתפיים, כפופים ל-90°.", "m": "החליקו את הידיים למעלה על הקיר ככל שניתן כשהאמות וגב כפות הידיים נשארים במגע, ואז החליקו למטה תוך משיכת המרפקים לכיוון האגן.", "c": "צלעות למטה, גב תחתון קרוב לקיר. אפשרו לשכמות להסתובב למעלה כשהידיים עולות.", "x": "קשת בגב התחתון כדי להגיע גבוה יותר, הרמת כתפיים, או איבוד מגע עם הקיר."}}, "c-lm180": {"en": {"s": "Stand facing the landmine, feet shoulder-width, holding the end of the bar with both hands at chest height.", "m": "Move the bar in an arc from one hip to the other, pivoting the back foot (as in a throw) so the hips turn with the trunk. Move with intent, but control the bar at each end.", "c": "The hips drive the rotation; the arms stay long; stop the bar under control at the hip.", "x": "Doing the work with the arms, losing balance, or letting the bar crash at the end of the arc."}, "he": {"n": "לנדמיין 180 (סיבוב כפות הרגליים)", "s": "עמדו מול הלנדמיין, רגליים ברוחב הכתפיים, אחזו בקצה המוט בשתי הידיים בגובה החזה.", "m": "הובילו את המוט בקשת מירך אחת לירך השנייה, תוך סיבוב כף הרגל האחורית (כמו בזריקה) כך שהאגן מסתובב יחד עם הגו. תנועה נמרצת, אבל עם שליטה בכל קצה.", "c": "האגן מוביל את הסיבוב; הידיים ארוכות; עצירת המוט בשליטה ליד הירך.", "x": "עבודה בעיקר עם הידיים, איבוד שיווי משקל, או נחיתה חדה של המוט בסוף הקשת."}}, "s-waiter": {"en": {"s": "Stand tall with a small plate resting flat on the palm in the waiter position: elbow bent, palm up, plate level at shoulder height.", "m": "Keeping the plate level, circle it inward under the armpit, then behind and over the head, and back to the front. Reverse the direction for the next set. Do both sides.", "c": "The plate stays level throughout. Slow and controlled, through the full range you can control. Trunk still.", "x": "Tilting the plate, leaning or twisting the trunk to make room, or rushing through the end range."}, "he": {"n": "מגש מלצר סביב העולם (צלחת משקל)", "s": "עמדו זקוף כשצלחת משקל קטנה מונחת שטוחה על כף היד בתנוחת מלצר: מרפק כפוף, כף יד כלפי מעלה, הצלחת ישרה בגובה הכתף.", "m": "תוך שמירה על הצלחת ישרה, סובבו אותה פנימה מתחת לבית השחי, אחר כך מאחורי הראש ומעליו, וחזרה לפנים. בסט הבא החליפו כיוון. בצעו בשני הצדדים.", "c": "הצלחת נשארת ישרה לאורך כל התנועה. לאט ובשליטה, בטווח המלא שבשליטה. הגו יציב.", "x": "הטיית הצלחת, הטיה או סיבוב של הגו כדי לפנות מקום, או מעבר מהיר בקצות הטווח."}}, "c-suit": {"en": {"s": "Hold one dumbbell or kettlebell at your side, arm straight, and stand tall.", "m": "Walk at a steady pace for the set distance or time without leaning. Switch hands.", "c": "Shoulders level, ribs down, controlled steps, firm grip.", "x": "Leaning toward or away from the weight, shrugging, or letting the weight swing."}, "he": {"n": "הליכת מזוודה (יד אחת)", "s": "החזיקו משקולת או קטלבל אחד לצד הגוף, יד ישרה, ועמדו זקוף.", "m": "הלכו בקצב קבוע למרחק או לזמן שנקבע בלי להטות את הגו. החליפו יד.", "c": "כתפיים בגובה שווה, צלעות למטה, צעדים מבוקרים, אחיזה חזקה.", "x": "הטיה לכיוון המשקל או הרחק ממנו, הרמת הכתף, או נדנוד המשקל."}}, "c-farm": {"en": {"s": "Hold a weight in each hand at your sides (or stand inside a trap bar), arms straight, and stand tall.", "m": "Walk at a steady pace for the set distance or time, then put the weights down with a flat back.", "c": "Tall posture, shoulders back and down, ribs down, short controlled steps, firm grip.", "x": "Rounding the back when picking up or putting down, shrugging, or leaning forward."}, "he": {"n": "הליכת חקלאי", "s": "החזיקו משקל בכל יד לצד הגוף (או מוט משושה), ידיים ישרות, ועמדו זקוף.", "m": "הלכו בקצב קבוע למרחק או לזמן שנקבע, ואז הניחו את המשקלות עם גב ישר.", "c": "יציבה זקופה, כתפיים לאחור ולמטה, צלעות למטה, צעדים קצרים ומבוקרים, אחיזה חזקה.", "x": "עיגול הגב בהרמה או בהנחה, הרמת כתפיים, או הטיה קדימה."}}, "s-ohw": {"en": {"s": "Press one dumbbell overhead and lock the arm out, upper arm near the ear, wrist straight. The other arm relaxed at your side.", "m": "Walk at a steady pace for the set distance or time, keeping the dumbbell stacked over the shoulder. Switch arms.", "c": "Shoulder blade drawn up and back toward the weight, ribs down, stand tall without leaning away from the weight.", "x": "Bending the elbow, letting the arm drift forward, leaning to the side, or arching the lower back."}, "he": {"n": "הליכה עם משקולת אחת מעל הראש", "s": "דחפו משקולת אחת מעל הראש ונעלו את היד ישרה, הזרוע ליד האוזן, שורש כף היד ישר. היד השנייה רפויה לצד הגוף.", "m": "הלכו בקצב קבוע למרחק או לזמן שנקבע, כשהמשקולת נשארת מעל הכתף. החליפו יד.", "c": "השכמה משוכה למעלה ולאחור לכיוון המשקל, צלעות למטה, עמידה זקופה בלי להטות את הגו הרחק מהמשקל.", "x": "כיפוף המרפק, יד שבורחת קדימה, הטיה לצד, או קשת בגב התחתון."}}, "s-ber": {"en": {"s": "Anchor a band at elbow height and stand side-on to it, holding the band in the hand farther from the anchor. Elbow bent to 90° and held against your side (a rolled towel between elbow and body helps).", "m": "Rotate the forearm outward, away from the body, keeping the elbow at 90° and at your side. Return slowly.", "c": "Movement from the shoulder only; the forearm stays horizontal. Stand farther from the anchor for more resistance. Slow return, 2–3 s.", "x": "The elbow drifting away from the body, twisting the trunk, or bending the wrist to gain range."}, "he": {"n": "סיבוב חיצוני של הכתף עם גומייה, מרפק ב-90°", "s": "עגנו גומייה בגובה המרפק ועמדו בצד לעיגון, אחזו בגומייה ביד הרחוקה מהעיגון. המרפק מכופף ל-90° וצמוד לגוף (מגבת מגולגלת בין המרפק לגוף עוזרת).", "m": "סובבו את האמה החוצה, הרחק מהגוף, כשהמרפק נשאר ב-90° וצמוד לגוף. חזרו לאט.", "c": "התנועה רק מהכתף; האמה נשארת אופקית. התרחקות מהעיגון מגבירה את ההתנגדות. חזרה איטית, 2–3 שניות.", "x": "התרחקות המרפק מהגוף, סיבוב הגו, או כיפוף שורש כף היד כדי להגדיל טווח."}}, "s-bt": {"en": {"s": "Stand on the middle of the band and hinge at the hips with a flat back, torso close to parallel to the floor, knees slightly bent. One end in each hand (cross the ends for more tension), arms hanging straight down, thumbs forward.", "m": "Raise the arms out to the sides to shoulder height to form a “T”, squeezing the shoulder blades together. Lower slowly against the band.", "c": "Start the movement from the shoulder blades. Arms straight, neck in line with the spine. Use a band you can control through the full range.", "x": "Rounding the back, shrugging, or using momentum."}, "he": {"n": "T בהטיה קדימה עם גומייה", "s": "עמדו על מרכז הגומייה והתכופפו מהאגן עם גב ישר, הגו כמעט מקביל לרצפה, ברכיים מעט כפופות. קצה בכל יד (הצלבת הקצוות מגבירה את המתח), ידיים תלויות ישר למטה, אגודלים קדימה.", "m": "הרימו את הידיים לצדדים עד גובה הכתפיים ליצירת „T”, תוך קירוב השכמות. הורידו לאט נגד הגומייה.", "c": "התנועה מתחילה מהשכמות. ידיים ישרות, צוואר בהמשך הגב. בחרו גומייה שאפשר לשלוט בה לאורך כל הטווח.", "x": "עיגול הגב, הרמת כתפיים, או תנופה."}}, "s-by": {"en": {"s": "Same position as the band “T”: standing on the band, hip hinge, flat back, one end in each hand.", "m": "Raise the arms forward and up at about 45° outside the head to form a “Y”, thumbs up, until the arms are in line with the torso. Lower slowly against the band.", "c": "Draw the shoulder blades down and back before lifting. Light band.", "x": "Arching the lower back, shrugging (the upper trapezius takes over), or bending the elbows."}, "he": {"n": "Y בהטיה קדימה עם גומייה", "s": "אותו מנח כמו ב-T עם גומייה: עמידה על הגומייה, הטיה מהאגן, גב ישר, קצה בכל יד.", "m": "הרימו את הידיים קדימה ולמעלה בזווית של כ-45° מחוץ לקו הראש ליצירת „Y”, אגודלים למעלה, עד שהידיים בקו הגו. הורידו לאט נגד הגומייה.", "c": "משכו את השכמות למטה ולאחור לפני ההרמה. גומייה קלה.", "x": "קשת בגב התחתון, הרמת כתפיים (הטרפז העליון משתלט), או כיפוף מרפקים."}}, "c-bpallof": {"en": {"s": "Anchor a band at chest height and stand (or half-kneel) side-on to it. Hold the band with both hands against the sternum, far enough away that it is taut.", "m": "Press the hands straight out in front of the chest, hold 2–3 s while resisting the pull, then bring them back. Do both sides.", "c": "The trunk stays square to the front. Stand farther from the anchor for more resistance.", "x": "Rotating toward the anchor, leaning away from it, or shrugging."}, "he": {"n": "פאלוף עם גומייה", "s": "עגנו גומייה בגובה החזה ועמדו (או כרעו על ברך אחת) בצד לעיגון. אחזו בגומייה בשתי הידיים צמוד לעצם החזה, במרחק שבו הגומייה מתוחה.", "m": "דחפו את הידיים ישר קדימה מול החזה, החזיקו 2–3 שניות תוך התנגדות למשיכה, והחזירו. בצעו בשני הצדדים.", "c": "הגו נשאר ישר מול הכיוון הקדמי. התרחקות מהעיגון מגבירה את ההתנגדות.", "x": "סיבוב לכיוון העיגון, הטיה הרחק ממנו, או הרמת כתפיים."}}, "c-pike": {"en": {"s": "High plank with the feet on sliders (or on a towel or in socks on a smooth floor), hands under the shoulders.", "m": "Keeping the legs straight and the hands in place, lift the hips and slide the feet toward the hands into an inverted V. Slide back out to the plank with control.", "c": "Arms straight and shoulders pushing the floor away; the movement comes from the hips. Return slowly without letting the hips sag.", "x": "Bending the knees, the shoulders drifting far past the hands, or sagging toward the floor at the end."}, "he": {"n": "פייק עם סליידרים", "s": "פלאנק גבוה עם כפות הרגליים על סליידרים (או על מגבת או בגרביים על רצפה חלקה), כפות הידיים מתחת לכתפיים.", "m": "הרגליים ישרות והידיים נשארות במקום; הרימו את האגן והחליקו את כפות הרגליים לכיוון הידיים לצורת V הפוכה. החליקו חזרה לפלאנק בשליטה.", "c": "ידיים ישרות וכתפיים דוחפות את הרצפה; התנועה מהאגן. חזרה איטית בלי שקיעת האגן.", "x": "כיפוף ברכיים, כתפיים שבורחות הרבה לפני הידיים, או שקיעה לכיוון הרצפה בסוף התנועה."}}, "c-rpl": {"en": {"s": "Sit with the legs straight and the hands on the floor slightly behind the hips, fingers toward t nd.", "c": "Movement comes from the shoulders only; the forearms stay horizontal; draw the shoulder blades lightly back at the end. Slow return, 2–3 s.", "x": "Elbows drifting away from the body, pulling the band apart by straightening the elbows, or arching the lower back."}, "he": {"n": "סיבוב חיצוני של הכתפיים עם גומייה, שתי ידיים, מרפקים ב-90°", "s": "עמדו זקוף ואחזו גומייה קלה בשתי הידיים, כפות ידיים כלפי מעלה, מרפקים כפופים ל-90° וצמודים לגוף, הידיים בערך ברוחב הכתפיים עם מתח קל בגומייה.", "m": "סובבו את שתי האמות החוצה, הרחק זו מזו, כשהמרפקים נשארים צמודים לגוף. חזרו לאט נגד הגומייה.", "c": "התנועה רק מהכתפיים; האמות נשארות אופקיות; קירוב קל של השכמות לאחור בסוף התנועה. חזרה איטית, 2–3 שניות.", "x": "התרחקות המרפקים מהגוף, מתיחת הגומייה ביישור המרפקים, או קשת בגב התחתון."}}, "s-er90": {"en": {"s": "Stand or sit with the upper arm raised to the side at shoulder height, parallel to the floor, elbow bent to 90° and forearm pointing forward. Hold a water bottle or a similar light object, or a light band anchored under the foot on the same side.", "m": "Rotate the forearm upward until it points to the ceiling, keeping the upper arm level and the elbow at 90°. Lower slowly. Do both sides.", "c": "The upper arm stays parallel to the floor and the elbow in line with the shoulder. Light load, full control.", "x": "Dropping the elbow, shrugging, arching the back, or using momentum."}, "he": {"n": "סיבוב חיצוני של הכתף ב-90° (בקבוק או גומייה)", "s": "עמדו או שבו כשהזרוע מורמת לצד בגובה הכתף, מקבילה לרצפה, המרפק כפוף ל-90° והאמה מכוונת קדימה. החזיקו בקבוק מים או חפץ קל דומה, או גומייה קלה מעוגנת מתחת לכף הרגל באותו צד.", "m": "סובבו את האמה למעלה עד שהיא מכוונת לתקרה, כשהזרוע נשארת אופקית והמרפק ב-90°. הורידו לאט. בצעו בשני הצדדים.", "c": "הזרוע נשארת מקבילה לרצפה והמרפק בקו הכתף. משקל קל, שליטה מלאה.", "x": "הורדת המרפק, הרמת הכתף, קשת בגב, או תנופה."}}};

function doseLine(id,lang){const d=DOSE[id];if(!d)return "";const [lo,hi,u,side,hold]=d,rng=lo+"–"+hi;
  if(lang==="he"){const U={r:"חזרות",s:"שניות",m:"מטר",roll:"גלגולים",circ:"סיבובים לכל כיוון"};

const BY=Object.fromEntries(EX.map(e=>[e.id,e]));

function norm(x){if(!x||typeof x!=="object")return null;if(!x.archers)x.archers={};if(!x.localNames)x.localNames=[];return x}
let S=norm(load())||{lastArcher:"",localNames:[],archers:{}};

function sync(){const f=norm(load());if(f)S=f}
let persistAsked=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));
  if(!persistAsked&&navigator.storage&&navigator.storage.persist){persistAsked=true;navigator.storage.persist().catch(()=>{})}}catch(e){storageOK=false}}
function A(name){
  if(!S.archers[name])S.archers[name]={likes:[],log:[],pending:null,n:{...DEFAULT_N}};

const fmtDay=t=>new Date(t).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
