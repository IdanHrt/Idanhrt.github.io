/* ---------- Draw logic: continuous rotation per category ----------
   A cycle closes only when every exercise in the category has been completed (no time limit).
   Inside a cycle, not-yet-done exercises fill the slots; liked ones come up earlier (x2.5).
   One slot per session may be a liked exercise already done this cycle (50% chance, needs 2+ slots),
   so the cycle still advances by at least n-1 exercises every session. */
const BONUS_P=0.5, KIND_ORDER={liked:0,fill:0,cycle:1,next:2};
function weekLog(a){const w=weekStart();return a.log.filter(s=>s.t>=w)}
function poolOf(c){return EX.filter(e=>e.c===c)}
/* Exercises an archer has paused ("can't do") are left out of the draw and of the cycle until restored. */
function isPaused(a,id){return !!(a.blocked&&a.blocked[id])}
/* No-equipment mode: bodyweight only (floor, wall, sturdy chair, a towel or socks on a smooth floor instead of sliders). Classified per exercise
   from its equipment and setup, not from the library's Travel-compatible column. The cycle is tracked over this set;
   the full cycle picks up again when the mode is switched off, since all sessions stay in the log. */
const TRAVEL=new Set(["s-bt", "s-by", "s-bier", "s-er90", "s-dep", "s-prot", "s-swim", "s-wall", "c-inch", "c-hollow", "c-hroll", "c-touch", "c-super", "c-spk", "c-sps", "c-bext", "c-cext", "c-pike", "c-rpl", "c-rpll", "c-drag", "c-lsit"]);
function inMode(a,id){return !a.noEquip||TRAVEL.has(id)}
function availOf(a,c){return poolOf(c).filter(e=>!isPaused(a,e.id)&&inMode(a,e.id))}
function cycleState(a,c){
  const avail=new Set(availOf(a,c).map(e=>e.id)), size=avail.size; let done=new Set(), cycle=1;
  if(size)for(const s of a.log){for(const id of s.ids){if(!avail.has(id))continue;done.add(id);if(done.size>=size){done=new Set();cycle++}}}
  return {done,cycle,size};
}
function lastSessionIds(a){const l=a.log[a.log.length-1];return new Set(l?l.ids:[])}
function lastDone(a,id){for(let i=a.log.length-1;i>=0;i--){if(a.log[i].ids.includes(id))return a.log[i].t}return 0}
function weightedPick(list,wf){
  const ws=list.map(wf);const tot=ws.reduce((p,q)=>p+q,0);if(!tot)return list[0];
  let r=Math.random()*tot;for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i]}return list[list.length-1];
}
/* Returns [{id,kind}] for one category; kind: "cycle" (counts toward this cycle), "liked" (liked repeat), "next" (cycle finished, starts the next one). */
/* Wrist rule: at most WRIST_MAX exercises with weight on the hands (wrists in extension) per session, across both categories. */
const WRIST=new Set(["s-dep", "s-prot", "c-inch", "c-touch", "c-super", "c-pike", "c-rpl", "c-rpll", "c-drag", "c-lsit"]), WRIST_MAX=1;
/* Versions of the same movement (cable/band, progression pairs): at most one per session. */
const FAM={"s-cer": "er", "s-t": "t", "s-y": "y", "c-hollow": "hollow", "c-hroll": "hollow", "c-pallof": "pallof", "c-spk": "sideplank", "c-sps": "sideplank", "c-lmtw": "landmine", "c-bext": "proneext", "c-cext": "proneext", "c-lm180": "landmine", "s-ber": "er", "s-bt": "t", "s-by": "y", "c-bpallof": "pallof", "c-rpl": "rplank", "c-rpll": "rplank", "c-whk": "wheel", "c-whf": "wheel", "s-bier": "er", "s-er90": "er90", "s-der": "er90"};
function wristCount(ids){return ids.filter(id=>WRIST.has(id)).length}
function drawCat(a,c,n,exclude,keep,allowBonus,wristUsed){
  const done=cycleState(a,c).done, last=lastSessionIds(a), likes=new Set(a.likes);
  const picked=[], out=[], usedSub=new Map(), fams=new Set(); let wr=wristUsed||0;
  (keep||[]).forEach(id=>{const s=BY[id].sub;usedSub.set(s,(usedSub.get(s)||0)+1);if(FAM[id])fams.add(FAM[id])});
  const w=(e,extra)=>(likes.has(e.id)?LIKE_W:1)*Math.pow(SAME_SUB_W,usedSub.get(e.sub)||0)*(last.has(e.id)?LAST_SESSION_W:1)*(extra||1);
  const ok=e=>!picked.includes(e)&&!(WRIST.has(e.id)&&wr>=WRIST_MAX)&&!(FAM[e.id]&&fams.has(FAM[e.id]));
  const take=(e,kind)=>{picked.push(e);out.push({id:e.id,kind});usedSub.set(e.sub,(usedSub.get(e.sub)||0)+1);if(WRIST.has(e.id))wr++;if(FAM[e.id])fams.add(FAM[e.id])};
  const pool=availOf(a,c).filter(e=>!exclude.has(e.id));
  const remaining=pool.filter(e=>!done.has(e.id));
  const likedDone=pool.filter(e=>done.has(e.id)&&likes.has(e.id));
  const bonus=(allowBonus&&n>=2&&likedDone.some(ok)&&remaining.length>=n-1&&Math.random()<BONUS_P)?1:0;
  for(let f;out.length<n-bonus&&(f=remaining.filter(ok)).length;){take(weightedPick(f,x=>w(x)),"cycle")}
  if(bonus){const f=likedDone.filter(ok);if(f.length)take(weightedPick(f,x=>w(x)),"liked")}
  const now=Date.now();
  /* Slots still open: either the cycle is finished ("next": starts the next cycle) or what is left of it
     is blocked by the wrist rule this session ("fill": a repeat that does not affect the cycle). */
  for(let f;out.length<n&&(f=pool.filter(ok)).length;){
    const e=weightedPick(f,x=>w(x,1+Math.min(14,(now-lastDone(a,x.id))/864e5)));
    const cycleLeft=remaining.some(x=>!picked.includes(x));
    take(e,done.has(e.id)&&cycleLeft?"fill":(done.has(e.id)||!remaining.includes(e)?"next":"cycle"));
  }
  return out;
}
function drawSession(a){
  const order=Math.random()<0.5?["S","C"]:["C","S"], got={S:[],C:[]};
  let wr=0;
  for(const c of order){got[c]=drawCat(a,c,a.n[c],new Set(),[],true,wr);wr+=wristCount(got[c].map(x=>x.id))}
  a.pending={t:Date.now(),items:[...got.S,...got.C]};
}
function replaceOne(a,id){
  const it=a.pending.items, idx=it.findIndex(x=>x.id===id); if(idx<0)return null;
  const c=BY[id].c, shown=new Set(it.map(x=>x.id));
  const others=it.filter(x=>x.id!==id).map(x=>x.id);
  const keep=others.filter(x=>BY[x].c===c);
  return {it,idx,r:drawCat(a,c,1,shown,keep,false,wristCount(others))};
}
function swapOne(a,id){
  const o=replaceOne(a,id); if(!o)return false;
  if(o.r.length)o.it[o.idx]=o.r[0]; else toast("No other "+CAT[BY[id].c].label.toLowerCase()+" exercise left to swap in");
  return o.r.length>0;
}
const WHY={pain:"Pain or discomfort",equip:"No equipment",other:"Other reason"};
function pauseEx(a,id,why){
  a.blocked[id]={t:Date.now(),why};
  if(a.pending){const it=a.pending.items, idx=it.findIndex(x=>x.id===id);
    if(idx>=0){const c=BY[id].c, shown=new Set(it.map(x=>x.id)), keep=it.filter(x=>x.id!==id&&BY[x.id].c===c).map(x=>x.id);
      const o=replaceOne(a,id); if(o&&o.r.length)it[idx]=o.r[0]; else it.splice(idx,1);}}
}

/* ---------- Progress: weekly goal, streak, arrows, badges (derived from this archer's own log) ---------- */
const DEFAULT_GOAL=5, MIN_GOAL=3, MAX_GOAL=7;
function goalOf(a){return Math.max(MIN_GOAL,Math.min(MAX_GOAL,a.goal||DEFAULT_GOAL))}
function addWeeks(w,k){const d=new Date(w);d.setDate(d.getDate()+7*k);return weekStart(d)}
function streaks(a){
  const m=new Map(), g=goalOf(a), cur=weekStart();
  for(const s of a.log){const w=weekStart(new Date(s.t));m.set(w,(m.get(w)||0)+1)}
  let w=(m.get(cur)||0)>=g?cur:addWeeks(cur,-1), streak=0;
  while((m.get(w)||0)>=g){streak++;w=addWeeks(w,-1)}
  let best=0,run=0,met=0;
  if(a.log.length){for(let x=weekStart(new Date(a.log[0].t));x<=cur;x=addWeeks(x,1)){
    if((m.get(x)||0)>=g){run++;met++;best=Math.max(best,run)}else if(x!==cur)run=0}}
  return {streak,best:Math.max(best,streak),weeksMet:met};
}
function fullCycle(a,c){const ne=a.noEquip;a.noEquip=false;const r=cycleState(a,c).cycle;a.noEquip=ne;return r}
function statsOf(a){
  const tried=new Set(), cyc={S:0,C:0}; let arrows=0, ne=0;
  for(const s of a.log){arrows+=s.ids.length;s.ids.forEach(i=>tried.add(i));(s.cyc||[]).forEach(c=>cyc[c]++);if(s.ne)ne++}
  return {...streaks(a),arrows,sessions:a.log.length,cyc,ne,thisWeek:weekLog(a).length,goal:goalOf(a),
    triedAll:EX.filter(e=>!isPaused(a,e.id)).every(e=>tried.has(e.id))};
}
/* Arrow milestones use archery round sizes: 72 (ranking round), 144 (double round), 720, 1440. */
const BADGES=[
 {id:"first",t:"First end",d:"Complete your first session",ok:s=>s.sessions>=1},
 {id:"goal1",t:"On target",d:"Hit your weekly goal",ok:s=>s.weeksMet>=1},
 {id:"st3",t:"Grouping",d:"Weekly goal 3 weeks in a row",ok:s=>s.best>=3},
 {id:"st6",t:"Tight group",d:"Weekly goal 6 weeks in a row",ok:s=>s.best>=6},
 {id:"st12",t:"Season form",d:"Weekly goal 12 weeks in a row",ok:s=>s.best>=12},
 {id:"cs",t:"Shoulder round",d:"Complete a full shoulder cycle",ok:s=>s.cyc.S>=1},
 {id:"cc",t:"Core round",d:"Complete a full core cycle",ok:s=>s.cyc.C>=1},
 {id:"all",t:"Full quiver",d:"Do every exercise at least once",ok:s=>s.triedAll},
 {id:"a72",t:"Ranking round",d:"72 arrows (exercises done)",ok:s=>s.arrows>=72},
 {id:"a144",t:"Double round",d:"144 arrows",ok:s=>s.arrows>=144},
 {id:"a720",t:"Ten rounds",d:"720 arrows",ok:s=>s.arrows>=720},
 {id:"a1440",t:"Twenty rounds",d:"1,440 arrows",ok:s=>s.arrows>=1440},
 {id:"road",t:"On the road",d:"5 sessions in no-equipment mode",ok:s=>s.ne>=5}
];
function earnedSet(st){return new Set(BADGES.filter(b=>b.ok(st)).map(b=>b.id))}
const MEDAL='<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 2h5l3 9h-5zM22 2h-5l-3 9h5z" fill="currentColor" opacity=".55"/><circle cx="16" cy="20" r="10" fill="currentColor"/><circle cx="16" cy="20" r="6.5" fill="none" stroke="var(--surface)" stroke-width="1.6"/><circle cx="16" cy="20" r="2.4" fill="var(--surface)"/></svg>';
const RING_COLORS=["var(--gold)","var(--core)","var(--shoulder)","var(--ring-black)","var(--ring-white)","var(--ring-white)","var(--ring-white)"];
/* Weekly goal as a target face: one ring per planned session, filled from the outside in; the last session hits the gold. */
function goalRing(done,goal){
  let c='';
  for(let i=0;i<goal;i++){const r=(36*(goal-i)/goal).toFixed(2), filled=i<done;
    c+='<circle cx="38" cy="38" r="'+r+'" fill="'+(filled?RING_COLORS[goal-1-i]:'var(--surface)')+'" stroke="var(--line)" stroke-width="1"/>';}
  return '<svg viewBox="0 0 76 76" role="img" aria-label="'+done+' of '+goal+' sessions this week">'+c+'</svg>';
}

/* ---------- Rendering ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.1A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.5 2.8c0 5.5-7.5 10.1-7.5 10.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const SWAP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const app=document.getElementById("app");
const main=document.createElement("div");main.style.cssText="display:flex;flex-direction:column;gap:22px";
app.appendChild(main);
let canEditRoster=false, artifactNS=null, askId=null, drawConfirm=false, undoConfirm=false;

function render(){
  const name=S.lastArcher&&allNames().includes(S.lastArcher)?S.lastArcher:"";
  const names=allNames();
  let h="";
  if(!storageOK)h+='<p class="notice">This browser is blocking storage, so your rotation will not be remembered after you close the page.</p>';

  /* archer picker */
  h+='<section class="panel" aria-labelledby="who"><div class="row" style="justify-content:space-between"><h2 id="who">Archer</h2>'+''+'</div>';
  if(names.length){
    h+='<label class="label" for="archer">Choose your name</label><select id="archer"><option value="">—</option>'+names.map(n=>'<option'+(n===name?' selected':'')+'>'+esc(n)+'</option>').join("")+'</select>';
  }else{
    h+='<p class="empty" style="text-align:left;padding:0">No squad list yet. The coach adds names under <b>Squad list</b> at the bottom of the page. You can add your own name below in the meantime.</p>';
  }
  h+='<details><summary>Not on the list? Add your name on this device</summary><div class="addname" style="margin-top:8px"><input type="text" id="newname" maxlength="40" placeholder="First and last name" autocomplete="name"><button class="btn" id="addname">Add</button></div></details></section>';

  if(name){
    const a=A(name), wl=weekLog(a);
    const now=new Set((a.pending?a.pending.items:[]).map(x=>x.id));
    h+='<section class="panel" aria-label="Rotation"><div class="row" style="justify-content:space-between"><h2>Rotation</h2><span class="mono">'+wl.length+' session'+(wl.length===1?'':'s')+' this week</span></div>'+
      '<div class="toggle"><div style="min-width:0;flex:1"><div class="name" id="noeq-l">No equipment</div><div class="hint" id="noeq-d">Bodyweight only: the floor, a wall, a sturdy chair, a towel or socks instead of sliders, and a light band or water bottle where an exercise says so.</div></div><button class="switch" role="switch" id="noequip" aria-checked="'+(!!a.noEquip)+'" aria-labelledby="noeq-l" aria-describedby="noeq-d"><span></span></button></div><div class="week">';
    for(const c of ["S","C"]){
      const cs=cycleState(a,c), done=cs.done, pool=poolOf(c), d=pool.filter(e=>done.has(e.id)).length, avail=cs.size;
      h+='<div class="cat '+c+'"><div class="head"><span class="name">'+CAT[c].label+' <span class="label">'+(a.noEquip?'no-equipment set':'cycle '+cs.cycle)+'</span></span><span class="mono" title="Exercises completed in this cycle">'+d+'/'+avail+'</span></div><div class="dots">'+
        pool.map(e=>'<span class="dot'+(!inMode(a,e.id)?' off':isPaused(a,e.id)?' paused':done.has(e.id)?' done':'')+(now.has(e.id)?' now':'')+'" title="'+esc(e.n)+(!inMode(a,e.id)?' (needs equipment)':isPaused(a,e.id)?' (paused)':done.has(e.id)?' (done)':'')+'"></span>').join("")+
        '</div><div class="row" style="gap:8px"><span class="label">Per session</span><span class="stepper"><button data-step="'+c+'" data-d="-1" aria-label="Fewer '+CAT[c].label+' exercises">−</button><span class="mono">'+a.n[c]+'</span><button data-step="'+c+'" data-d="1" aria-label="More '+CAT[c].label+' exercises">+</button></span></div></div>';
    }
    h+='</div></section>';
  }

  /* draw */
  const pa=name?A(name).pending:null, hasPending=!!(pa&&pa.items&&pa.items.length);
  if(hasPending&&pa.t<new Date().setHours(0,0,0,0)){
    h+='<section class="confirm" role="alert"><div><b>Not saved yet:</b> you drew a session on '+esc(fmtDay(pa.t))+' but didn’t mark it done.</div><div class="chips"><button class="btn primary" data-complete="1" data-when="drawn">I did it on '+esc(fmtDay(pa.t))+'</button><button class="btn" id="discard">I didn’t do it</button></div></section>';
  }
  h+='<section class="drawzone"><button class="target" id="draw" '+(name?'':'disabled')+' aria-label="Draw exercises"><span>DRAW</span></button><div class="hint">'+(name?'Tap the target or press <kbd>Space</kbd>':'Choose your name first')+'</div>';
  if(drawConfirm&&hasPending){
    h+='<div class="confirm" role="alert"><div>The session below isn’t marked done yet. Drawing again would discard it.</div><div class="chips"><button class="btn primary" data-complete="1">Mark it done</button><button class="btn" id="redraw">Discard it and draw new</button><button class="btn quiet" id="drawcancel">Cancel</button></div></div>';
  }
  h+='</section>';

  if(name){
    const a=A(name), likes=new Set(a.likes);
    if(a.pending&&a.pending.items.length){
      for(const c of ["S","C"]){
        const its=a.pending.items.filter(x=>BY[x.id].c===c); if(!its.length)continue;
        h+='<section class="group '+c+'"><h2>'+CAT[c].label+'</h2>';
        for(const it of its){const e=BY[it.id];
          h+='<div class="card"><div class="body"><div class="t">'+esc(e.n)+(it.kind==="liked"?'<span class="tag" title="One of your liked exercises, already done this cycle">liked repeat</span>':it.kind==="next"?'<span class="tag" title="This cycle is complete; this one starts the next cycle">next cycle</span>':it.kind==="fill"?'<span class="tag" title="Repeat, because the exercises left in your cycle load the wrists and this session already has one">repeat</span>':'')+'</div>'+(DOSE[e.id]?'<div class="dose">'+esc(doseLine(e.id,"en"))+'</div>':'')+'<div class="m">'+esc(e.eq)+' · '+esc(e.pos)+' · '+esc(e.lat)+'</div>'+(e.note?'<div class="note">'+esc(e.note)+'</div>':'')+'<div class="links"><button class="howto" data-info="'+e.id+'">How to do it</button><button class="howto alt" data-ask="'+e.id+'" aria-expanded="'+(askId===e.id)+'">Can’t do this</button></div>'+
             (askId===e.id?'<div class="ask" role="group" aria-label="Why can’t you do it?"><div class="label">Why? It won’t come up again until you restore it.</div><div class="chips">'+Object.keys(WHY).map(k=>'<button class="btn" data-pause="'+e.id+'" data-why="'+k+'">'+WHY[k]+'</button>').join("")+'<button class="btn quiet" data-askcancel="1">Cancel</button></div></div>':'')+'</div>'+
             '<div class="acts"><button class="icon'+(likes.has(e.id)?' liked':'')+'" data-like="'+e.id+'" aria-pressed="'+likes.has(e.id)+'" aria-label="'+(likes.has(e.id)?'Unlike ':'Like ')+esc(e.n)+'">'+HEART+'</button><button class="icon" data-swap="'+e.id+'" aria-label="Swap '+esc(e.n)+'">'+SWAP+'</button></div></div>';
        }
        h+='</section>';
      }
      h+='<div class="done-bar"><span class="hint">Drawn '+esc(fmtDay(a.pending.t))+', '+esc(fmtTime(a.pending.t))+'</span><button class="btn primary" id="complete">Mark session done</button></div>';
    }else{
      h+='<p class="empty">No session drawn. Exercises you have not done in this cycle come up first.</p>';
    }

    const st=statsOf(a), got=earnedSet(st), wk=Math.min(st.thisWeek,st.goal);
    const stat=(n,l)=>'<div class="stat"><div class="sv mono">'+n+'</div><div class="sl">'+l+'</div></div>';
    h+='<section class="panel" aria-label="Progress"><div class="row" style="justify-content:space-between"><h2>Progress</h2><span class="label">'+got.size+' of '+BADGES.length+' badges</span></div>'+
      '<div class="prog"><div class="goalring">'+goalRing(wk,st.goal)+'</div><div class="goalinfo"><div class="name">Weekly goal'+(st.thisWeek>=st.goal?' <span class="tag hit">hit</span>':'')+'</div><div class="hint">'+st.thisWeek+' of '+st.goal+' sessions this week</div>'+
      '<div class="row" style="gap:8px"><span class="stepper"><button data-goal="-1" aria-label="Lower weekly goal">−</button><span class="mono">'+st.goal+'</span><button data-goal="1" aria-label="Raise weekly goal">+</button></span><span class="label">per week</span></div></div></div>'+
      '<div class="stats">'+stat(st.streak,'week streak')+stat(st.best,'best streak')+stat(st.arrows,'arrows')+stat(st.cyc.S+st.cyc.C,'cycles')+'</div>'+
      '<details><summary>Badges</summary><ul class="badges">'+BADGES.map(b=>'<li class="'+(got.has(b.id)?'got':'')+'">'+MEDAL+'<div style="min-width:0"><div class="bt">'+esc(b.t)+(got.has(b.id)?'':' <span class="visually-hidden">(locked)</span>')+'</div><div class="bd">'+esc(b.d)+'</div></div></li>').join("")+'</ul></details></section>';
    const paused=EX.filter(e=>isPaused(a,e.id));
    if(paused.length){
      h+='<section class="panel"><div class="row" style="justify-content:space-between"><h2>Paused exercises</h2><span class="mono">'+paused.length+'</span></div><p class="hint" style="margin:0">These stay out of the draw until you restore them. If it is pain, tell your coach or physio. Every two weeks you’ll be asked whether the problem is resolved.</p><ul class="log">'+
        paused.map(e=>{const b=a.blocked[e.id];return '<li class="prow"><div style="min-width:0;flex:1"><div class="when">'+esc(e.n)+'</div><div style="color:var(--muted)">'+esc(WHY[b.why]||"Paused")+' · since '+esc(fmtDay(b.t))+'</div></div><button class="btn" data-restore="'+e.id+'">Restore</button></li>'}).join("")+'</ul></section>';
    }
    const recent=a.log.slice(-6);
    if(recent.length){
      h+='<section class="panel"><div class="row" style="justify-content:space-between"><h2>Recent sessions</h2><button class="btn quiet" id="undo">Remove last</button></div>'+
        (undoConfirm?'<div class="confirm" role="alert"><div>Remove the session from '+esc(fmtDay(recent[recent.length-1].t))+', '+esc(fmtTime(recent[recent.length-1].t))+'? It goes back to the draw unsaved.</div><div class="chips"><button class="btn primary" id="undoyes">Remove it</button><button class="btn quiet" id="undono">Keep it</button></div></div>':'')+
        '<p class="hint" style="margin:0">'+a.log.length+' session'+(a.log.length===1?'':'s')+' saved in this browser.</p><ul class="log">'+
        recent.slice().reverse().map(s=>'<li><div class="when">'+esc(fmtDay(s.t))+' · '+esc(fmtTime(s.t))+'</div><div class="m" style="color:var(--muted)">'+s.ids.map(i=>esc(BY[i]?BY[i].n:i)).join(" · ")+'</div></li>').join("")+'</ul></section>';
    }

    h+='<section class="panel"><details><summary>All exercises and your likes ('+a.likes.length+' liked)</summary><ul class="pool" style="margin-top:8px">'+
      EX.map(e=>'<li><span class="sw" style="background:var(--'+(e.c==="S"?'shoulder':'core')+')"></span><button class="pn" data-info="'+e.id+'">'+esc(e.n)+(isPaused(a,e.id)?'<span class="tag">paused</span>':'')+'</button><button class="icon'+(likes.has(e.id)?' liked':'')+'" data-like="'+e.id+'" aria-pressed="'+likes.has(e.id)+'" aria-label="'+(likes.has(e.id)?'Unlike ':'Like ')+esc(e.n)+'">'+HEART+'</button></li>').join("")+'</ul></details></section>';
  }

  h+='<footer><p><b>How the draw works.</b> Shoulder and core each run in a cycle. Every draw takes exercises you have not yet done in the current cycle, and a new cycle starts only after you have completed all of them, however long that takes. Liked exercises come up earlier in the cycle, and one slot in a session can be a liked exercise you have already done (marked “liked repeat”). A session never has more than one exercise with weight on the hands (to protect the wrists), or two versions of the same movement (for example cable and band). The draw avoids two exercises from the same sub-group in one session and avoids repeating your last session. Only sessions you mark done count. With “No equipment” on, the draw uses only bodyweight exercises (floor, wall, chair, a towel or socks instead of sliders) and cycles through those; your full cycle carries on when you switch it off. Tap “How to do it” on any exercise for a description in English or Hebrew. If you can’t do an exercise, tap “Can’t do this”: it is paused and left out of your cycle until you restore it.</p><p><b>Progress.</b> Set a weekly goal; each week you reach it extends your streak. Every exercise you complete counts as one arrow. Each card shows the sets and reps; tap “How to do it” for the full description. Badges mark streaks, full cycles and arrow totals.</p><p>Your history is saved in this browser on this device. Use the same phone each time.</p></footer>';

  if(canEditRoster){
    h+='<section class="panel"><details id="rosterbox"><summary>Squad list (coach)</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><label class="label" for="rosteredit">One name per line</label><textarea id="rosteredit" rows="8">'+esc(ROSTER.join("\n"))+'</textarea><div class="row"><button class="btn primary" id="saveroster">Save squad list</button><span class="hint">Publishes the page; everyone sees the new list.</span></div></div></details></section>';
  }
  main.innerHTML=h;
}

/* ---------- Events ---------- */
let toastT;
function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2400)}
function current(){return S.lastArcher&&allNames().includes(S.lastArcher)?A(S.lastArcher):null}
function doDraw(force){
  sync(); const a=current(); if(!a)return;
  if(!force&&a.pending&&a.pending.items&&a.pending.items.length){drawConfirm=true;undoConfirm=false;render();const c=main.querySelector(".confirm [data-complete]");if(c){c.scrollIntoView({block:"nearest"});c.focus()}return}
  drawConfirm=false; drawSession(a); save(); render();
  const b=document.getElementById("draw"); if(b){b.classList.add("hit");}
}
main.addEventListener("change",e=>{
  if(e.target.id==="archer"){sync();S.lastArcher=e.target.value;askId=null;drawConfirm=false;undoConfirm=false;save();render();maybeCheck()}
});
main.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  sync();
  const a=current();
  if(t.id==="draw")return doDraw();
  if(t.id==="redraw")return doDraw(true);
  if(t.id==="drawcancel"){drawConfirm=false;render();return}
  if(t.id==="discard"&&a){a.pending=null;drawConfirm=false;save();render();toast("Discarded");return}
  if(t.id==="undo"){undoConfirm=true;drawConfirm=false;render();const y=document.getElementById("undoyes");if(y)y.focus();return}
  if(t.id==="undono"){undoConfirm=false;render();return}
  if(t.dataset.info)return openInfo(t.dataset.info,t);
  if(t.dataset.ask){askId=askId===t.dataset.ask?null:t.dataset.ask;render();const f=main.querySelector('[data-pause]');if(f)f.focus();return}
  if(t.dataset.askcancel){const id=askId;askId=null;render();const b=main.querySelector('[data-ask="'+id+'"]');if(b)b.focus();return}
  if(t.dataset.pause&&a){const id=t.dataset.pause;askId=null;pauseEx(a,id,t.dataset.why);save();render();toast("Paused: "+BY[id].n);return}
  if(t.dataset.goal&&a){a.goal=Math.max(MIN_GOAL,Math.min(MAX_GOAL,goalOf(a)+Number(t.dataset.goal)));save();render();return}
  if(t.id==="noequip"&&a){a.noEquip=!a.noEquip;save();render();const b=document.getElementById("noequip");if(b)b.focus();toast((a.noEquip?"No-equipment mode on":"No-equipment mode off")+(a.pending?". Draw again for a new session":""));return}
  if(t.dataset.restore&&a){const id=t.dataset.restore;delete a.blocked[id];save();render();toast("Restored: "+BY[id].n);return}
  if(t.id==="addname"){
    const inp=document.getElementById("newname"); const v=(inp.value||"").trim().replace(/\s+/g," ");
    if(!v){inp.focus();return}
    if(!allNames().includes(v))S.localNames.push(v);
    S.lastArcher=v; save(); render(); toast("Added "+v+" on this device"); return;
  }
  if(t.dataset.step&&a){const c=t.dataset.step;a.n[c]=Math.max(1,Math.min(EX.filter(x=>x.c===c).length,a.n[c]+Number(t.dataset.d)));save();render();return}
  if(t.dataset.like&&a){const id=t.dataset.like;const i=a.likes.indexOf(id);if(i>=0)a.likes.splice(i,1);else a.likes.push(id);save();
    const open=document.querySelector("details[open]")!==null; render(); if(open){const d=main.querySelector(".pool");if(d)d.closest("details").open=true}
    toast(i>=0?"Removed from likes":"Liked: shows up more often");return}
  if(t.dataset.swap&&a&&a.pending){swapOne(a,t.dataset.swap);save();render();return}
  if((t.id==="complete"||t.dataset.complete)&&a&&a.pending){
    const ord=a.pending.items.map((x,i)=>({x,i})).sort((p,q)=>((KIND_ORDER[p.x.kind]??1)-(KIND_ORDER[q.x.kind]??1))||(p.i-q.i));
    const before=earnedSet(statsOf(a)), cb={S:fullCycle(a,"S"),C:fullCycle(a,"C")}, wkBefore=weekLog(a).length;
    const entry={t:(t.dataset.when==="drawn"?a.pending.t:Date.now()),ids:ord.map(o=>o.x.id)}; if(a.noEquip)entry.ne=1;
    a.log.push(entry); a.log.sort((p,q)=>p.t-q.t); drawConfirm=false;
    const cyc=["S","C"].filter(c=>fullCycle(a,c)>cb[c]); if(cyc.length)entry.cyc=cyc;
    const st=statsOf(a), fresh=BADGES.filter(b=>b.ok(st)&&!before.has(b.id));
    a.pending=null; save(); render();
    const b=document.getElementById("draw"); if(b)b.classList.add("hit");
    const goalNow=wkBefore<st.goal&&st.thisWeek>=st.goal;
    const line="+"+entry.ids.length+" arrows · "+st.thisWeek+"/"+st.goal+" this week"+(goalNow?" · weekly goal hit":"")+(cyc.length?" · "+cyc.map(c=>CAT[c].label.toLowerCase()).join(" and ")+" cycle complete":"");
    if(fresh.length)showBadges(fresh,line); else toast(line); return;
  }
  if(t.id==="undoyes"&&a){undoConfirm=false;if(!a.log.length){render();return}const last=a.log.pop();const st={S:cycleState(a,"S").done,C:cycleState(a,"C").done};const lk=new Set(a.likes);a.pending={t:Date.now(),items:last.ids.filter(id=>BY[id]).map(id=>({id,kind:st[BY[id].c].has(id)?(lk.has(id)?"liked":"next"):"cycle"}))};save();render();toast("Session removed and moved back to the draw");return}
  if(t.id==="saveroster")return saveRoster();
});
document.addEventListener("keydown",e=>{
  if(!sheet.hidden){if(e.key==="Escape")closeInfo();return}
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target&&e.target.tagName)||"";
  if(/INPUT|TEXTAREA|SELECT|BUTTON|SUMMARY/.test(tag))return;
  if(e.code==="Space"||e.key==="Enter"){e.preventDefault();doDraw()}
});

/* ---------- Exercise description sheet (English or Hebrew, choice remembered on this device) ---------- */
const LBL={en:{s:"Setup",m:"Movement",c:"Key points",x:"Avoid",d:"Sets × reps",close:"Close"},he:{s:"מנח התחלה",m:"ביצוע",c:"דגשים",x:"להימנע",d:"סטים × חזרות",close:"סגירה"}};
const sheet=document.createElement("div");sheet.className="sheet";sheet.hidden=true;document.body.appendChild(sheet);
let infoId=null, infoOpener=null;
function renderInfo(){
  const e=BY[infoId], d=DESC[infoId]; if(!e||!d)return;
  const lang=S.lang==="he"?"he":"en", L=LBL[lang], t=d[lang];
  const title=lang==="he"?t.n:e.n;
  const meta=lang==="en"?'<div style="color:var(--muted);font-size:.86rem">'+esc(e.eq)+' · '+esc(e.pos)+' · '+esc(e.lat)+'</div>':'';
  sheet.innerHTML='<div class="box '+e.c+'" role="dialog" aria-modal="true" aria-labelledby="sheet-title">'+
    '<div class="bar"><div class="seg" role="group" aria-label="Language"><button data-lang="en" lang="en" aria-pressed="'+(lang==="en")+'">English</button><button data-lang="he" lang="he" aria-pressed="'+(lang==="he")+'">עברית</button></div>'+
    '<button class="btn" id="sheet-close" lang="'+lang+'">'+L.close+'</button></div>'+
    '<div lang="'+lang+'" dir="'+(lang==="he"?"rtl":"ltr")+'" class="'+(lang==="he"?"he":"")+'" style="display:flex;flex-direction:column;gap:12px">'+
    '<div><h3 id="sheet-title">'+esc(title)+'</h3>'+meta+'</div>'+
    '<dl>'+(DOSE[infoId]?'<div><dt>'+L.d+'</dt><dd class="dosedd">'+esc(doseLine(infoId,lang))+'</dd></div>':'')+["s","m","c","x"].map(k=>'<div><dt>'+L[k]+'</dt><dd>'+esc(t[k])+'</dd></div>').join("")+'</dl></div></div>';
}
function openInfo(id,opener){
  if(!DESC[id])return; infoId=id; infoOpener=opener||null;
  renderInfo(); sheet.hidden=false; document.body.style.overflow="hidden";
  const c=document.getElementById("sheet-close"); if(c)c.focus();
}
function closeInfo(){
  sheet.hidden=true; sheet.innerHTML=""; document.body.style.overflow=""; checkArcher=null;
  const id=infoId; infoId=null;
  const back=main.querySelector('[data-info="'+id+'"]')||infoOpener; if(back&&back.focus)back.focus();
}
/* Paused exercises: every 14 days the archer is asked whether the issue is resolved. */
const RECHECK_DAYS=14;
function dueChecks(a){const now=Date.now();return EX.filter(e=>{const b=a.blocked&&a.blocked[e.id];return b&&now-(b.asked||b.t)>=RECHECK_DAYS*864e5})}
let checkArcher=null;
function renderCheck(){
  const a=checkArcher?A(checkArcher):null; const due=a?dueChecks(a):[];
  if(!due.length){closeInfo();render();return}
  sheet.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-labelledby="check-title"><div class="bar"><h3 id="check-title">Still can’t do these?</h3><button class="btn quiet" id="check-later">Ask me later</button></div>'+
    '<p class="hint" style="margin:0">You paused these more than two weeks ago. If the problem is gone, put the exercise back in your rotation.</p><ul class="log">'+
    due.map(e=>{const b=a.blocked[e.id];return '<li><div class="when">'+esc(e.n)+'</div><div style="color:var(--muted);font-size:.86rem">'+esc(WHY[b.why]||"Paused")+' · paused '+esc(fmtDay(b.t))+'</div><div class="chips" style="margin-top:8px"><button class="btn primary" data-resolve="'+e.id+'">Resolved, restore it</button><button class="btn" data-still="'+e.id+'">Still a problem</button></div></li>'}).join("")+'</ul></div>';
}
function maybeCheck(){
  const a=current(); if(!a||!sheet.hidden)return; if(!dueChecks(a).length)return;
  checkArcher=S.lastArcher; infoId=null; infoOpener=null;
  renderCheck(); sheet.hidden=false; document.body.style.overflow="hidden";
  const f=sheet.querySelector("[data-resolve]"); if(f)f.focus();
}
function showBadges(list,line){
  infoId=null; infoOpener=null; checkArcher=null;
  sheet.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-labelledby="badge-title"><div class="bar"><h3 id="badge-title">'+(list.length>1?'New badges':'New badge')+'</h3><button class="btn primary" id="sheet-close">Nice</button></div>'+
    '<p class="hint" style="margin:0">Session saved. '+esc(line)+'</p><ul class="badges big">'+list.map(b=>'<li class="got">'+MEDAL+'<div><div class="bt">'+esc(b.t)+'</div><div class="bd">'+esc(b.d)+'</div></div></li>').join("")+'</ul></div>';
  sheet.hidden=false; document.body.style.overflow="hidden";
  const c=document.getElementById("sheet-close"); if(c)c.focus();
}
sheet.addEventListener("click",e=>{
  if(e.target===sheet)return closeInfo();
  const b=e.target.closest("button"); if(!b)return;
  sync();
  if(b.id==="check-later")return closeInfo();
  if(b.dataset.resolve&&checkArcher){const a=A(checkArcher);delete a.blocked[b.dataset.resolve];save();toast("Restored: "+BY[b.dataset.resolve].n);renderCheck();const f=sheet.querySelector("[data-resolve]");if(f)f.focus();return}
  if(b.dataset.still&&checkArcher){const a=A(checkArcher);if(a.blocked[b.dataset.still])a.blocked[b.dataset.still].asked=Date.now();save();renderCheck();const f=sheet.querySelector("[data-resolve]");if(f)f.focus();return}
  if(b.id==="sheet-close")return closeInfo();
  if(b.dataset.lang){S.lang=b.dataset.lang;save();renderInfo();const nb=sheet.querySelector('[data-lang="'+S.lang+'"]');if(nb)nb.focus()}
});

/* ---------- Coach: squad list, republished with the page ---------- */
function buildDoc(names){
  const reset=(document.head.querySelector("style")||{}).textContent||"";
  const q=s=>document.querySelector(s);
  const close="<"+"/script>";
  const json=JSON.stringify(names).replace(/</g,"\\u003c");
  const shell='<div id="app" class="wrap">\n  <header>\n    <div class="label">National team · Shoulder health &amp; core</div>\n    <h1>Rehab Draw</h1>\n    <p class="lede">Pick your name, hit the target, do the exercises. The draw works through the whole list in rotation and favours the ones you like.</p>\n  </header>\n  <noscript><p class="notice">This page needs JavaScript to draw exercises.</p></noscript>\n</div>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>Archery Rehab Draw</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    q('link[href*="fonts.googleapis"]').outerHTML+'\n<style>'+q('body style').textContent+'</style>\n\n'+shell+'\n\n'+
    '<script type="application/json" id="roster-data">'+json+close+'\n\n<script id="main">'+document.getElementById("main").textContent+close+'\n</body></html>';
}
async function saveRoster(){
  const ta=document.getElementById("rosteredit"); if(!ta||!artifactNS)return;
  const names=[...new Set(ta.value.split("\n").map(s=>s.trim().replace(/\s+/g," ")).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const btn=document.getElementById("saveroster"); btn.disabled=true; btn.textContent="Saving…";
  try{await artifactNS.publish(buildDoc(names))}
  catch(err){
    const c=err&&err.code;
    if(c==="conflict"){return}
    if(c==="not_writer"||c==="not_granted"){canEditRoster=false;render();toast("Only the coach can change the squad list");return}
    btn.disabled=false;btn.textContent="Save squad list";toast("Could not save the squad list. Try again in a moment.");
  }
}

window.addEventListener("storage",e=>{if(e.key===KEY||e.key===null){sync();render()}});
window.addEventListener("pageshow",e=>{if(e.persisted){sync();render()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){sync();render()}});
render();
maybeCheck();
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [art,usr]=await Promise.all([window.claude.use("artifact"),window.claude.use("user")]);
    artifactNS=art;
    const can=usr?await usr.canEdit():false;
    if(art&&can){canEditRoster=true;render()}
  }catch(e){}
})();
})();
</script>
